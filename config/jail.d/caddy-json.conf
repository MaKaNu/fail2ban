# Caddy JSON Log Jail
# 
# This jail monitors Caddy web server JSON logs for failed authentication attempts
# and brute force attacks using JSON parsing capabilities.
#
# Usage:
# 1. Configure Caddy to output JSON logs
# 2. Add this jail to your fail2ban configuration
# 3. Adjust the logpath to point to your Caddy JSON log file
#

[caddy-json]

enabled = false
port = http,https
filter = caddy-json
logpath = /var/log/caddy/access.json
maxretry = 3
bantime = 600
findtime = 600

# JSON parsing configuration
jsonparsing = yes
jsonpath = $.request.remote_addr $.request.method $.request.uri $.request.status
jsonignorepath = $.request.status

# Actions to take when attacks are detected
action = iptables-multiport[name=caddy-json, port="%(port)s"]
        mail-whois[name=caddy-json, dest=admin@example.com] 