# Fail2Ban filter for Caddy web server JSON logs
#
# This filter demonstrates JSON parsing support in fail2ban
# for structured log output from modern web servers.
#
# Caddy JSON log format example:
# {"level":"info","ts":1640995200.123,"msg":"handled request","request":{"remote_addr":"192.168.1.100","method":"POST","uri":"/login","status":401},"duration":0.045,"size":1234}
#
# Author: Fail2Ban Contributors
#

[Definition]

# Enable JSON parsing
jsonparsing = yes

# JSONPath expressions to extract relevant data
# Extract remote address, method, URI, and status code
jsonpath = $.request.remote_addr $.request.method $.request.uri $.request.status

# JSONPath expressions for ignore conditions
# Ignore successful requests (status < 400)
jsonignorepath = $.request.status

# Regular expressions to match on extracted JSON data
# Match failed authentication attempts (401, 403) and brute force attempts
failregex = ^json_field_0=<HOST> json_field_1=POST json_field_2=/login json_field_3=(401|403)$
            ^json_field_0=<HOST> json_field_1=POST json_field_2=/admin json_field_3=(401|403)$
            ^json_field_0=<HOST> json_field_1=POST json_field_2=/wp-admin json_field_3=(401|403)$

# Ignore patterns (if any)
ignoreregex =

# Date pattern for JSON timestamp
datepattern = ^.*"ts":(\d+\.\d+).*$

# Maximum lines to buffer
maxlines = 1 